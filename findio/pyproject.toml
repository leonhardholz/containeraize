[project]
name = "findio"
version = "0.1.0"
description = "Find files in a repository that are likely to perform I/O"
requires-python = ">=3.11"
dependencies = [
    "litellm",
    "tenacity",
    "pathspec",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
findio = "findio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
